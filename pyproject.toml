[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnote-stt"
version = "0.1.0"
description = "Local Korean speech-to-text with terminology correction and optional speaker diarization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "82ko81" }]
dependencies = [
  "faster-whisper>=1.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
speakers = ["sherpa-onnx>=1.12"]

[project.scripts]
vnote-stt = "vnote.cli:main"
vnote-models = "vnote.models:main"

[tool.setuptools.packages.find]
include = ["vnote*"]
